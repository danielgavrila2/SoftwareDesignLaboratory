services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_DELETE_TOPIC_ENABLE: "true"

  postgres:
    image: postgres:15
    container_name: postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fitness_db
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mongodb:
    image: mongo:6
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/postgres
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8085:8080"
    depends_on:
      - postgres

  configserver:
    build: ./configserver
    container_name: configserver
    ports:
      - "8888:8888"
    networks:
      - fitness-network

  eureka:
    build: ./Eureka
    container_name: eureka
    ports:
      - "8761:8761"
    depends_on:
      - configserver
    networks:
      - fitness-network

  userservice:
    build: ./userservice
    container_name: userservice
    ports:
      - "8081:8081"
    depends_on:
      - configserver
      - eureka
      - postgres
      - keycloak
    networks:
      - fitness-network

  activityservice:
    build: ./activityservice
    container_name: activityservice
    ports:
      - "8082:8082"
    depends_on:
      - configserver
      - eureka
      - mongodb
      - kafka
    networks:
      - fitness-network
      
  aiservice:
    build: ./aiservice
    container_name: aiservice
    ports:
      - "8083:8083"
    depends_on:
      - configserver
      - eureka
      - mongodb
      - kafka
    networks:
      - fitness-network

  nutritionservice:
    build: ./nutritionservice
    container_name: nutritionservice
    ports:
      - "8084:8084"
    depends_on:
      - configserver
      - eureka
    networks:
      - fitness-network

  gateway:
    build: ./gateway
    container_name: gateway
    ports:
      - "8080:8080"
    depends_on:
      - configserver
      - eureka
    networks:
      - fitness-network

  fitness-frontend:
    build: ./fitness-frontend
    container_name: fitness-frontend
    ports:
      - "5173:80"
    networks:
      - fitness-network

networks:
  fitness-network:
    driver: bridge

volumes:
  postgres-data:
  mongo-data: